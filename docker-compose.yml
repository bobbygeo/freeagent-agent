services:
  freeagent-agent:
    build: .
    container_name: freeagent-agent
    ports:
      # Avoid :3000 — binds localhost only
      - "127.0.0.1:3847:3847"
    env_file:
      - .env
    environment:
      PORT: "3847"
      BIND_HOST: "0.0.0.0"
      FREEAGENT_REDIRECT_URI: "http://127.0.0.1:3847/oauth/callback"
      FREEAGENT_TOKEN_PATH: "/app/data/.oauth-tokens.json"
    volumes:
      - ./data:/app/data
      # Optional: drop receipt PDFs/images here for a future matcher
      - ./receipts:/receipts:ro
    restart: unless-stopped
